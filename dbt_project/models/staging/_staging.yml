version: 2

models:
  - name: stg_product
    columns:
      - name: sku_id
        tests: [unique, not_null]
      - name: category
        tests:
          - accepted_values:
              values: ["Antiseptics", "Disinfectants", "Toilet Care", "Fabric Care", "Air Care", "Cough & Throat"]

  - name: stg_distributor
    columns:
      - name: distributor_id
        tests: [unique, not_null]
      - name: channel_type
        tests:
          - accepted_values:
              values: ["General Trade", "Modern Trade", "Pharmacy", "E-commerce"]

  - name: stg_date
    columns:
      - name: month_start
        tests: [unique, not_null]

  - name: stg_sellout
    description: "Clean sell-out: exact duplicates removed, returns excluded, net sales derived."
    columns:
      - name: month_start
        tests: [not_null]
      - name: sku_id
        tests: [not_null]
      - name: distributor_id
        tests: [not_null]
      - name: promo_flag
        tests:
          - accepted_values:
              values: [0, 1]

  - name: stg_returns
    columns:
      - name: month_start
        tests: [not_null]
      - name: units
        tests: [not_null]

  - name: stg_shipments
    columns:
      - name: month_start
        tests: [not_null]

  - name: stg_targets
    columns:
      - name: target_net_sales
        tests: [not_null]

  - name: stg_retail_audit
    columns:
      - name: value_share_pct
        tests: [not_null]
